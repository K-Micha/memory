<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>

<body>
    <main class="settings">
        <div class="settings__wrapper">

            <section class="settings__header">
                <h1>Settings</h1>
                <span class="indicator indicator--head"></span>
            </section>

            <section class="settings__content">

                <section class="settings__options settings--column">

                    <div class="settings__group settings--column">
                        <h2>Game themes</h2>

                        <div class="settings__list settings--column">
                            <div class="settings__option">
                                <input id="theme-code" type="radio" name="theme" value="code" checked>
                                <label for="theme-code">Code vibes theme</label>
                                <span class="indicator indicator--head"></span>
                            </div>

                            <div class="settings__option">
                                <input id="theme-gaming" type="radio" name="theme" value="gaming">
                                <label for="theme-gaming">Gaming theme</label>
                                <span class="indicator indicator--head"></span>
                            </div>

                            <div class="settings__option">
                                <input id="theme-da" type="radio" name="theme" value="da-projects">
                                <label for="theme-da">DA Projects theme</label>
                                <span class="indicator indicator--head"></span>
                            </div>

                            <div class="settings__option">
                                <input id="theme-foods" type="radio" name="theme" value="foods">
                                <label for="theme-foods">Foods theme</label>
                                <span class="indicator indicator--head"></span>
                            </div>
                        </div>
                    </div>

                    <div class="settings__group settings--column">
                        <h2>Choose player</h2>

                        <div class="settings__list settings--column">
                            <div class="settings__option">
                                <input id="player-blue" type="radio" name="player" value="blue" checked>
                                <label for="player-blue">Blue</label>
                                <span class="indicator indicator--head"></span>
                            </div>

                            <div class="settings__option">
                                <input id="player-orange" type="radio" name="player" value="orange">
                                <label for="player-orange">Orange</label>
                                <span class="indicator indicator--head"></span>
                            </div>
                        </div>
                    </div>

                    <div class="settings__group settings--column">
                        <h2>Board size</h2>

                        <div class="settings__list settings--column">
                            <div class="settings__option">
                                <input id="board-16" type="radio" name="board" value="16" checked>
                                <label for="board-16">16 Cards</label>
                                <span class="indicator indicator--head"></span>
                            </div>

                            <div class="settings__option">
                                <input id="board-24" type="radio" name="board" value="24">
                                <label for="board-24">24 Cards</label>
                                <span class="indicator indicator--head"></span>
                            </div>

                            <div class="settings__option">
                                <input id="board-36" type="radio" name="board" value="36">
                                <label for="board-36">36 Cards</label>
                                <span class="indicator indicator--head"></span>
                            </div>
                        </div>
                    </div>

                </section>

                <section class="theme-preview settings--column">
                    <img class="theme-preview__image" src="./src/assets/img/theme-preview-it.webp"
                        alt="Code vibes theme preview">

                    <section class="settings-summary">
                        <div class="settings-summary__item">
                            <span>Game theme</span>
                        </div>

                        <span class="indicator indicator--head"></span>

                        <div class="settings-summary__item">
                            <span>Player</span>
                        </div>

                        <span class="indicator indicator--head"></span>

                        <div class="settings-summary__item">
                            <span>Board size</span>
                        </div>

                        <button class="btn yellow" type="button" onclick="startGame()">
                            Start
                        </button>
                    </section>
                </section>

            </section>

        </div>
    </main>

    <script type="module" src="/src/main.ts"></script>
</body>

</html>
