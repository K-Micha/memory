<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Memory Game</title>
    <script type="module" src="/src/main.ts"></script>
</head>

<body class="settings--body">
    <main class="settings">
        <div class="settings__wrapper">

            <section class="headline">
                <h1>Settings</h1>
                <span class="indicator indicator--head"></span>
            </section>

            <section class="settings__content">

                <section class="options">

                    <div class="options__group">
                        <div class="options__header">
                            <img class="options__icon" src="./src/assets/img/palette.svg" alt="">
                            <h2>Game themes</h2>
                        </div>

                        <div class="options__list">
                            <div class="options__item">
                                <input id="theme-code" type="radio" name="theme" value="code" checked>
                                <label for="theme-code">Code vibes theme</label>
                                <span class="indicator indicator--head"></span>
                            </div>

                            <div class="options__item">
                                <input id="theme-food" type="radio" name="theme" value="food">
                                <label for="theme-food">Foods theme</label>
                                <span class="indicator indicator--head"></span>
                            </div>
                        </div>
                    </div>

                    <div class="options__group">
                        <div class="options__header">
                            <img class="options__icon" src="./src/assets/img/chess_pawn.svg" alt="">
                            <h2>Choose player</h2>
                        </div>

                        <div class="options__list">
                            <div class="options__item">
                                <input id="player-blue" type="checkbox" name="player" value="blue">
                                <label for="player-blue">Blue</label>
                                <span class="indicator indicator--head"></span>
                            </div>

                            <div class="options__item">
                                <input id="player-orange" type="checkbox" name="player" value="orange">
                                <label for="player-orange">Orange</label>
                                <span class="indicator indicator--head"></span>
                            </div>
                        </div>
                    </div>

                    <div class="options__group">
                        <div class="options__header">
                            <img class="options__icon" src="./src/assets/img/style.svg" alt="">
                            <h2>Board size</h2>
                        </div>

                        <div class="options__list">
                            <div class="options__item">
                                <input id="board-16" type="radio" name="board" value="16">
                                <label for="board-16">16 cards</label>
                                <span class="indicator indicator--head"></span>
                            </div>

                            <div class="options__item">
                                <input id="board-24" type="radio" name="board" value="24">
                                <label for="board-24">24 cards</label>
                                <span class="indicator indicator--head"></span>
                            </div>

                            <div class="options__item">
                                <input id="board-36" type="radio" name="board" value="36">
                                <label for="board-36">36 cards</label>
                                <span class="indicator indicator--head"></span>
                            </div>
                        </div>
                    </div>

                </section>

                <section class="theme-preview">
                    <img id="theme-preview" class="theme-preview__image" src="./src/assets/img/dev-theme.svg"
                        alt="Theme preview">

                    <section class="summary">
                        <div class="summary__item">Game theme</div>
                        <span class="indicator  indicator--head"></span>

                        <div class="summary__item">Player</div>
                        <span class="indicator indicator--head"></span>

                        <div class="summary__item">Board size</div>

                        <button class="btn yellow summary__item--hight" type="button" onclick="startGame()">
                            <img src="./src/assets/img/start.svg" alt="">
                            <span>Start</span>
                        </button>
                    </section>
                </section>

            </section>

        </div>
    </main>

    <script type="module" src="/src/settings.ts"></script>
</body>

</html>
