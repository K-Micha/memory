<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>

<body>
    <main class="settings">

        <div class="settings__wrapper">

            <section class="settings__header">

                <h1>Settings</h1>

                <span class="settings__header-indicator"></span>

            </section>

            <section class="settings__content">

                <section class="settings__options">

                    <div class="option-group">

                        <h2>Game themes</h2>

                        <label>
                            <input type="radio" name="theme" checked>
                            <span>Code vibes theme</span>
                            <span class="indicator"></span>
                        </label>

                        <label>
                            <input type="radio" name="theme">
                            <span>Gaming theme</span>
                            <span class="indicator"></span>
                        </label>

                        <label>
                            <input type="radio" name="theme">
                            <span>DA Projects theme</span>
                            <span class="indicator"></span>
                        </label>

                        <label>
                            <input type="radio" name="theme">
                            <span>Foods theme</span>
                            <span class="indicator"></span>
                        </label>

                    </div>

                    <div class="option-group">

                        <h2>Choose player</h2>

                        <label>
                            <input type="radio" name="player" checked>
                            <span>Blue</span>
                            <span class="indicator"></span>
                        </label>

                        <label>
                            <input type="radio" name="player">
                            <span>Orange</span>
                            <span class="indicator"></span>
                        </label>

                    </div>

                    <div class="option-group">

                        <h2>Board size</h2>

                        <label>
                            <input type="radio" name="board" checked>
                            <span>16 Cards</span>
                            <span class="indicator"></span>
                        </label>

                        <label>
                            <input type="radio" name="board">
                            <span>24 Cards</span>
                            <span class="indicator"></span>
                        </label>

                        <label>
                            <input type="radio" name="board">
                            <span>36 Cards</span>
                            <span class="indicator"></span>
                        </label>

                    </div>

                </section>

                <section class="theme-preview">

                    <img src="./src/assets/img/theme-preview-it.webp" alt="Code vibes theme preview">

                    <section class="settings-summary">

                        <article class="summary-item">

                            <h3>Game Theme</h3>

                            <p>Code vibes</p>

                        </article>

                        <span class="separator"></span>

                        <article class="summary-item">

                            <h3>Player</h3>

                            <p>Blue</p>

                        </article>

                        <span class="separator"></span>

                        <article class="summary-item">

                            <h3>Board Size</h3>

                            <p>16 Cards</p>

                        </article>

                        <button class="btn yellow" type="button" onclick="startGame()">

                            Start

                        </button>

                    </section>

                </section>

            </section>

        </div>

    </main>

    <script type="module" src="/src/main.ts"></script>
</body>

</html>
