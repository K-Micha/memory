<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Memory Game</title>
    <script type="module" src="/src/main.ts"></script>
</head>

<body class="game-body">

    <section class="modal modal--hidden" id="exit-modal">
        <div class="modal__box">
            <div class="modal__content">
                <h2 class="modal__title">
                    Are you sure you want <br>
                    to quit the game?
                </h2>

                <div class="modal__actions">
                    <button onclick="backGame()" class="btn modal__btn modal__btn--back" type="button">
                        Back to game
                    </button>

                    <button onclick="exitGame()" class="btn modal__btn modal__btn--exit" type="button">
                        Exit game
                    </button>
                </div>
            </div>
        </div>
    </section>

    <section id="game-over" class="game-over game-over--hidden">

        <div class="game-over__box">

            <h2 class="game-over__title-text">
                GAME OVER
            </h2>

            <img id="game-over-title" class="game-over__title-img" src="./src/assets/img/game-over.svg" alt="Game over"
                draggable="false">

            <div class="game-over__score">

                <span class="game-over__label">Final score</span>
                <div class="game-over__players">

                    <div id="game-over-blue" class="game-over__player">
                        <img class="game-over__icon" id="game-over-blue-icon" src="" alt="Blue player icon">
                        <span class="game-over__name--blue" id="game-over-blue-name">Blue</span>
                        <span class="game-over__info--blue" id="game-over-blue-score">0</span>
                    </div>

                    <div id="game-over-orange" class="game-over__player">
                        <img class="game-over__icon" id="game-over-orange-icon" src="" alt="Orange player icon">
                        <span class="game-over__name--orange" id="game-over-orange-name">Orange</span>
                        <span class="game-over__info--orange" id="game-over-orange-score">0</span>
                    </div>
                </div>
            </div>
        </div>

    </section>

    <section id="winner-overlay" class="winner winner--hidden">
        <div class="winner__confetti" aria-hidden="true">
            <span></span>
            <span></span>
            <span></span>
            <span></span>
            <span></span>
            <span></span>
            <span></span>
            <span></span>
        </div>

        <div class="winner__content">
            <span class="winner__label">The winner is</span>

            <div class="winner__wrapper">
                <h2 id="winner-name" class="winner__name">
                    <img class="winner__name-img" src="./src/assets/img/draw.svg" alt="Draw">
                    <span class="winner__name-text">DRAW</span>
                </h2>
                <img id="winner-icon" class="winner__icon" src="" alt="">

                <button class="btn winner__btn" type="button" onclick="backToStart()">
                    Back to start
                </button>
            </div>
        </div>
    </section>

    <main class="game">
        <header class="header">

            <aside class="header__score-panel">
                <div class="header__bg">

                    <div id="header-player-blue" class="header__item header__item--blue">
                        <img id="player-blue-icon" class="header__icon" src="./src/assets/img/blue.svg"
                            alt="blue player icon">
                        <span class="header__label header__label--blue">Blue</span>
                        <span class="header__value header__value--blue" id="score-blue">0</span>
                    </div>

                    <div id="header-player-orange" class="header__item header__item--orange">
                        <img id="player-orange-icon" class="header__icon" src="./src/assets/img/orange.svg"
                            alt="orange player icon">
                        <span class="header__label header__label--orange">Orange</span>
                        <span class="header__value header__value--orange" id="score-orange">0</span>
                    </div>
                </div>
            </aside>

            <div class="header__current-player">
                <span class="header__text">Current player:</span>
                <div id="current-player-wrapper" class="header__current-icon">
                    <img class="header__current-icon" id="current-player-icon" src="./src/assets/img/blue.svg"
                        alt="current icon">
                </div>
            </div>

            <button id="exit-btn" class="btn header__exit" type="button">
                <img id="exit-icon" class="header__exit-icon" src="./src/assets/img/exit.svg" alt="exit icon">

                <span class="header__exit-text">
                    Exit game
                </span>
            </button>

        </header>

        <section class="game__board">
            <div class="game__board-wrapper" id="field">
                <button class="card">
                    <div draggable="false" class="card__inner">
                        <div class="card__face card__face--front">
                            <div class="card__front-image">
                                <img src="./src/assets/game-1/front.svg" alt="logo">
                            </div>
                        </div>

                        <div draggable="false" class="card__face card__face--back">
                            <img class="card__image" src="" alt="Card img">
                        </div>
                    </div>
                </button>
            </div>
        </section>
    </main>
    <script type="module" src="./src/game-utils.ts"></script>
    <script type="module" src="./src/game.ts"></script>
</body>

</html>
