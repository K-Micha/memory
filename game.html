<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Memory Game</title>
</head>

<body class="game-body">

    <section class="modal modal--hidden" id="exit-modal">
        <div class="modal__box">
            <h2 class="modal__title">Are you sure you want to quit the game?</h2>

            <div class="modal__actions">
                <button class="btn modal__button" type="button">Back to game</button>
                <button class="btn modal__button" type="button">Exit game</button>
            </div>
        </div>
    </section>

    <main class="game">
        <header class="header">

            <div class="header__score-panel">
                <div class="header__bg">

                    <div class="header__item header__item--blue">
                        <img class="header__icon" src="./src/assets/img/blue.svg" alt="">
                        <span class="header__label">Blue</span>
                        <span class="header__value" id="score-blue">0</span>
                    </div>

                    <div class="header__item header__item--orange">
                        <img class="header__icon" src="./src/assets/img/orange.svg" alt="">
                        <span class="header__label">Orange</span>
                        <span class="header__value" id="score-orange">0</span>
                    </div>
                </div>
            </div>

            <div class="header__current-player">
                <span class="header__text">Current player:</span>

                <img class="header__current-icon" id="current-player-icon" src="./src/assets/img/blue.svg" alt="">
            </div>

            <button class="btn header__exit" type="button">
                <img class="header__exit-icon" src="./src/assets/img/exit.svg" alt="">

                <span class="header__exit-text">
                    Exit game
                </span>
            </button>

        </header>

        <section class="game__board" id="field">

            <button class="card">
                <div class="card__inner">
                    <div class="card__face card__face--front">
                        <div class="card__front-image">
                            <img src="./src/assets/game-1/front.svg" alt="logo">
                        </div>
                    </div>

                    <div class="card__face card__face--back">
                        <img class="card__image" src="" alt="">
                    </div>
                </div>
            </button>

        </section>
    </main>

    <script type="module" src="/src/main.ts"></script>
    <script type="module" src="./src/game.ts"></script>
</body>

</html>
