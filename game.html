<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Memory Game</title>
</head>

<body class="game-body">

    <section class="modal modal--hidden" id="exit-modal">
        <div class="modal__box">
            <h2 class="modal__title">Are you sure you want <br> to quit the game?</h2>

            <div class="modal__actions">
                <button class="btn modal__button" type="button">Back to game</button>
                <button class="btn modal__button" type="button">Exit game</button>
            </div>
        </div>
    </section>

    <main class="game">
        <header class="header">

            <div class="header__score-panel">
                <div class="header__bg">

                    <div class="header__item header__item--blue">
                        <img id="player-blue-icon" class="header__icon" src="./src/assets/img/blue.svg" alt="">
                        <span class="header__label header__label--blue">Blue</span>
                        <span class="header__value header__value--blue" id="score-blue">0</span>
                    </div>

                    <div class="header__item header__item--orange">
                        <img id="player-orange-icon" class="header__icon" src="./src/assets/img/orange.svg" alt="">
                        <span class="header__label header__label--orange">Orange</span>
                        <span class="header__value header__value--orange" id="score-orange">0</span>
                    </div>
                </div>
            </div>

            <div class="header__current-player">
                <span class="header__text">Current player:</span>
                <div id="current-player-wrapper" class="header__current-icon">
                    <img class="header__current-icon" id="current-player-icon" src="./src/assets/img/blue.svg" alt="">
                </div>
            </div>

            <button id="exit-btn" class="btn header__exit" type="button">
                <img id="exit-icon" class="header__exit-icon" src="./src/assets/img/exit.svg" alt="">

                <span class="header__exit-text">
                    Exit game
                </span>
            </button>

        </header>

        <section class="game__board">
            <div class="game__board-wrapper" id="field">
                <button class="card">
                    <div draggable="false" class="card__inner">
                        <div class="card__face card__face--front">
                            <div class="card__front-image">
                                <img src="./src/assets/game-1/front.svg" alt="logo">
                            </div>
                        </div>

                        <div draggable="false" class="card__face card__face--back">
                            <img class="card__image" src="" alt="">
                        </div>
                    </div>
                </button>
            </div>
        </section>
    </main>
    <script type="module" src="./src/game-utils.ts"></script>
    <script type="module" src="/src/main.ts"></script>
    <script type="module" src="./src/game.ts"></script>
</body>

</html>
